<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ACA-utils ESATS Dashboard</title>
  <link rel="stylesheet" href="esats-styles.css">
</head>
<body>
  <div class="esats-shell">
    <header class="esats-header">
      <div>
        <p class="eyebrow">ACA-utils · ESATS</p>
        <h1>Supported Application Dashboard</h1>
        <p id="sync-status" class="sync-status" aria-live="polite">Loading stored ESATS data…</p>
      </div>
      <div class="header-actions">
        <button id="esats-config-button" class="button button-secondary" type="button">ESATS supported MO configuration</button>
        <button id="refresh-data" class="button button-primary" type="button">Refresh Data</button>
        <button id="close-dashboard" class="button button-secondary" type="button">Close</button>
      </div>
    </header>

    <div id="sync-progress" class="sync-progress" hidden>
      <div class="progress-track" role="progressbar" aria-label="ESATS synchronization progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
      <strong id="progress-percent">0%</strong>
    </div>

    <main>
      <section id="summary-cards" class="summary-cards" aria-label="ESATS summary metrics"></section>

      <section id="supported-table-section" class="data-section" aria-labelledby="supported-table-title">
        <div class="section-heading"><div><p class="eyebrow">Applications</p><h2 id="supported-table-title">Supported MO applications</h2></div><div class="section-actions"><span id="supported-section-count" class="section-count-badge"></span><button id="clear-supported-filter" class="button button-quiet" type="button" hidden>Clear card filter</button></div></div>
        <p id="supported-filter-label" class="active-filter"></p>
        <div id="supported-table"></div>
      </section>

      <section id="retired-table-section" class="data-section" aria-labelledby="retired-table-title">
        <div class="section-heading"><div><p class="eyebrow">Retirement and deletion</p><h2 id="retired-table-title">Retired and marked-for-deletion applications</h2></div><div class="section-actions"><span id="retired-section-count" class="section-count-badge"></span><button id="clear-retired-filter" class="button button-quiet" type="button" hidden>Clear card filter</button></div></div>
        <p id="retired-filter-label" class="active-filter"></p>
        <div id="retired-table"></div>
      </section>

      <section id="lifecycle-table-section" class="data-section" aria-labelledby="lifecycle-table-title">
        <div class="section-heading"><div><p class="eyebrow">Lifecycle</p><h2 id="lifecycle-table-title">Lifecycle changes</h2></div><div class="section-actions"><span id="lifecycle-section-count" class="section-count-badge"></span><button id="clear-lifecycle-filter" class="button button-quiet" type="button" hidden>Clear card filter</button></div></div>
        <p id="lifecycle-filter-label" class="active-filter"></p>
        <div id="lifecycle-table"></div>
      </section>
    </main>
  </div>
  <div id="config-modal-backdrop" class="config-modal-backdrop" hidden>
    <section id="config-modal" class="config-modal" role="dialog" aria-modal="true" aria-labelledby="config-modal-title">
      <header class="config-modal-header">
        <div><p class="eyebrow">ESATS configuration</p><h2 id="config-modal-title">ESATS supported MO configuration</h2><p id="config-modal-subtitle" class="sync-status"></p></div>
        <button id="config-modal-close" class="modal-close-button" type="button" aria-label="Close configuration">×</button>
      </header>
      <div id="config-modal-toolbar" class="config-modal-toolbar"></div>
      <div id="config-modal-content" class="config-modal-content"></div>
      <footer id="config-modal-footer" class="config-modal-footer"></footer>
    </section>
  </div>
  <nav class="page-jump" aria-label="Page navigation">
    <button id="page-top" type="button" aria-label="Go to top" title="Go to top">↑</button>
    <div id="page-progress-ring" class="page-progress-ring" role="progressbar" aria-label="Page scroll progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="page-progress-value">0%</span></div>
    <button id="page-bottom" type="button" aria-label="Go to bottom" title="Go to bottom">↓</button>
  </nav>
  <div id="toast" class="toast" hidden role="status"></div>
  <script type="module" src="js/esats-ui.js"></script>
</body>
</html>
