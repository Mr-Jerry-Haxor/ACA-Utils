<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supported Compliance</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="dashboard-header">
      <div>
        <p class="eyebrow">IT Compliance Scorecard</p>
        <h1>Supported application compliance</h1>
        <p id="status-line" class="status-line" role="status">Loading compliance data…</p>
      </div>
      <div class="header-actions">
        <button id="supported-apps-button" class="button button-secondary" type="button">Supported Applications</button>
        <button id="config-button" class="button button-primary" type="button">Supported MO Configuration</button>
        <button id="refresh-button" class="button button-quiet" type="button">Refresh data</button>
        <button id="close-button" class="button button-quiet" type="button">Back to scorecard</button>
      </div>
    </header>

    <main>
      <section id="summary-strip" class="summary-strip" aria-label="Compliance summary"></section>
      <section id="metric-grid" class="metric-grid" aria-label="Compliance deliverables"></section>
      <section id="dr-alerts" class="alert-panel" hidden></section>
    </main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <div>
          <p id="modal-kicker" class="eyebrow"></p>
          <h2 id="modal-title"></h2>
          <p id="modal-subtitle" class="modal-subtitle"></p>
        </div>
        <button id="modal-close" class="icon-button" type="button" aria-label="Close dialog">×</button>
      </header>
      <div id="modal-toolbar" class="modal-toolbar"></div>
      <div id="modal-content" class="modal-content"></div>
      <footer id="modal-footer" class="modal-footer"></footer>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
