<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACA-utils host integration preview</title>
  <link rel="stylesheet" href="../src/host.css">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#f2f2f2}
    app-side-nav-outer-toolbar{display:flex;flex-direction:column;height:100%}
    app-header{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;color:#fff;background:#20232a;font-weight:700}
    .menu-button{border:1px solid #fff;border-radius:3px;color:#fff;background:transparent;cursor:pointer}
    dx-drawer{display:block;flex:1;min-height:0}.dx-drawer-wrapper{display:flex;height:100%}
    .dx-drawer-panel-content{width:250px;background:#2b2b35;color:#fff}
    app-side-navigation-menu,.menu-container,.dx-treeview{display:flex;flex-direction:column;height:100%}
    .dx-treeview-node-container{display:flex;flex-direction:column;flex:1;padding:0;margin:0;list-style:none}
    .dx-treeview-node{border-bottom:1px solid #515159}.dx-treeview-item{padding:16px 18px}
    .dx-drawer-content{flex:1;min-width:0}.with-footer{height:100%;overflow:auto}
    .content{min-height:calc(100% - 65px);padding:24px}.content-block{height:65px;padding:20px 24px;background:#fff;border-top:1px solid #ddd}
    #original-content{padding:30px;background:#fff;border:1px solid #ddd}
  </style>
  <script>globalThis.chrome={runtime:{getURL:(path)=>new URL('../src/'+path,location.href).href}};</script>
</head>
<body>
  <app-side-nav-outer-toolbar>
    <app-header><button class="menu-button" type="button">Menu</button>IT Compliance Scorecard</app-header>
    <dx-drawer><div class="dx-drawer-wrapper">
      <div class="dx-drawer-panel-content">
        <app-side-navigation-menu><div class="menu-container"><div class="dx-treeview"><ul class="dx-treeview-node-container">
          <li class="dx-treeview-node"><div class="dx-treeview-item">Dashboard</div></li>
          <li class="dx-treeview-node"><div class="dx-treeview-item">Application Compliance</div></li>
          <li class="dx-treeview-node"><div class="dx-treeview-item">Server Compliance</div></li>
        </ul></div></div></app-side-navigation-menu>
      </div>
      <div class="dx-drawer-content"><dx-scroll-view class="with-footer">
        <div class="content"><div id="original-content"><h1>Website content</h1><p>This content should be replaced after clicking ACA-utils.</p></div></div>
        <div class="content-block"><app-footer>IT Compliance Scorecard footer remains visible</app-footer></div>
      </dx-scroll-view></div>
    </div></dx-drawer>
  </app-side-nav-outer-toolbar>
  <script src="../src/content.js"></script>
  <script>
    const panel=document.querySelector('.dx-drawer-panel-content');
    const menu=document.querySelector('app-side-navigation-menu');
    const toggle=document.querySelector('.menu-button');
    const setMenuWidth=(width)=>{panel.style.width=width+'px';menu.style.width=width+'px'};
    toggle.addEventListener('dxclick',()=>setMenuWidth(menu.getBoundingClientRect().width>90?60:250));
    menu.addEventListener('dxclick',()=>setMenuWidth(250));
    setTimeout(()=>{
      document.getElementById('aca-supported-compliance-button')?.click();
      setTimeout(()=>document.body.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true})),250);
    },250);
  </script>
</body>
</html>
